<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>FF Rivals Tour</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #0a0a0f;
      color: #fff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }
    .wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 16px;
      padding: 24px;
      box-sizing: border-box;
      text-align: center;
    }
    .spin {
      width: 44px;
      height: 44px;
      border: 4px solid rgba(255, 106, 0, 0.2);
      border-top-color: #ff6a00;
      border-radius: 50%;
      animation: s 0.8s linear infinite;
    }
    @keyframes s {
      to { transform: rotate(360deg); }
    }
    h1 {
      font-size: 20px;
      margin: 0;
      color: #ff6a00;
      font-weight: 800;
    }
    p {
      margin: 0;
      color: #94a3b8;
      font-size: 13px;
      line-height: 1.5;
      max-width: 280px;
    }
    button {
      min-height: 44px;
      min-width: 170px;
      border: 0;
      border-radius: 12px;
      background: linear-gradient(135deg, #ff6a00, #ea580c);
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(255, 106, 0, 0.35);
      transition: opacity 0.2s;
    }
    button:active {
      opacity: 0.85;
      transform: scale(0.98);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="spin"></div>
    <h1 id="title">সার্ভারের সাথে সংযোগ স্থাপন করা হচ্ছে...</h1>
    <p id="desc">FF Rivals Tour সার্ভারে স্বয়ংক্রিয়ভাবে প্রবেশ করছে। অনুগ্রহ করে অপেক্ষা করুন...</p>
    <button id="btn" onclick="retryNow()">এখনই প্রবেশ করুন (Retry)</button>
  </div>
  <script>
    const TARGET_URL = 'https://hospitable-perception-production-d721.up.railway.app/?app=true&v=5.0.0';
    let reconnecting = false;

    function retryNow() {
      if (reconnecting) return;
      reconnecting = true;
      const btn = document.getElementById('btn');
      if (btn) btn.innerText = 'সংযোগ হচ্ছে...';
      window.location.replace(TARGET_URL);
    }

    // Auto-reconnect immediately after 300ms
    setTimeout(retryNow, 300);

    // Auto-retry every 2 seconds in case network was briefly negotiating
    setInterval(retryNow, 2000);

    // Instant reconnect on network online event
    window.addEventListener('online', retryNow);
  </script>
</body>
</html>
