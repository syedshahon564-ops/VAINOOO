<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Admin Login - FF RIVAL BD Owner Portal</title>
  <link rel="icon" href="/favicon.ico">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700;900&family=Rajdhani:wght@600;700;800&display=swap');
    body {
      font-family: 'Hind Siliguri', sans-serif;
      background-color: #0b0c10;
      color: #e2e8f0;
    }
    .font-gaming {
      font-family: 'Rajdhani', sans-serif;
    }
    .gold-gradient {
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 antialiased selection:bg-amber-500 selection:text-black">

  <div class="w-full max-w-md rounded-3xl bg-[#12141d] border border-amber-500/30 p-8 shadow-2xl shadow-amber-500/10 space-y-6 text-center">
    <div class="w-16 h-16 rounded-2xl gold-gradient text-black flex items-center justify-center mx-auto shadow-lg shadow-amber-500/30 text-2xl font-black">
      👑
    </div>

    <div>
      <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-amber-500/10 text-amber-400 text-xs font-black uppercase tracking-wider border border-amber-500/20">
        <i class="fa-solid fa-shield-halved"></i> Master Owner Login
      </span>
      <h2 class="text-2xl font-black text-white mt-2 font-gaming tracking-wide">
        FF RIVAL TOUR BD
      </h2>
      <p class="text-xs text-slate-400 mt-1">
        স্ট্যান্ডঅ্যালোন অ্যাডমিন ওয়েবসাইট লগইন। এখানে লগইন করে যেকোনো স্থান থেকে সম্পূর্ণ টুর্নামেন্ট সিস্টেম নিয়ন্ত্রণ করুন।
      </p>
    </div>

    <form id="adminLoginForm" onsubmit="handleLogin(event)" class="space-y-4 text-left">
      <div>
        <label class="block text-xs font-bold text-slate-300 mb-1.5">
          <i class="fa-solid fa-key text-amber-400 mr-1"></i> ওনার সিক্রেট পিন (Secret PIN):
        </label>
        <div class="relative">
          <input
            type="password"
            id="loginPin"
            placeholder="পিন দিন (ডিফল্ট: 7860)"
            class="w-full px-4 py-3.5 rounded-xl border border-slate-700 bg-black/60 text-amber-400 font-mono text-center text-lg tracking-widest focus:outline-none focus:border-amber-500 pr-10"
            required
            autofocus
          />
          <button
            type="button"
            onclick="togglePin()"
            class="absolute right-3 top-3.5 text-slate-400 hover:text-white"
          >
            <i id="eyeIcon" class="fa-solid fa-eye"></i>
          </button>
        </div>
      </div>

      <div id="loginAlert" class="hidden p-3 rounded-xl bg-rose-500/10 border border-rose-500/30 text-rose-400 text-xs font-bold flex items-center gap-2">
        <i class="fa-solid fa-circle-exclamation flex-shrink-0"></i>
        <span>ভুল সিক্রেট পিন! শুধুমাত্র সাইট ওনার প্রবেশ করতে পারবেন।</span>
      </div>

      <button
        type="submit"
        class="w-full py-3.5 rounded-xl gold-gradient hover:brightness-110 text-black font-black text-sm uppercase tracking-wider shadow-lg shadow-amber-500/30 transition-all flex items-center justify-center gap-2"
      >
        <i class="fa-solid fa-arrow-right-to-bracket"></i> অ্যাডমিন প্যানেলে প্রবেশ করুন
      </button>
    </form>

    <div class="pt-3 border-t border-slate-800 flex items-center justify-between text-xs text-slate-500">
      <a href="/" class="hover:text-amber-400 transition-colors">
        <i class="fa-solid fa-house mr-1"></i> মূল ওয়েবসাইট
      </a>
      <a href="/admin.html" class="hover:text-amber-400 transition-colors font-bold text-amber-500/80">
        সরাসরি প্যানেল <i class="fa-solid fa-arrow-right ml-1"></i>
      </a>
    </div>
  </div>

  <script>
    const ADMIN_AUTH_KEY = 'ff_admin_secret_auth_v1';

    function togglePin() {
      const pin = document.getElementById('loginPin');
      const icon = document.getElementById('eyeIcon');
      if (pin.type === 'password') {
        pin.type = 'text';
        icon.className = 'fa-solid fa-eye-slash';
      } else {
        pin.type = 'password';
        icon.className = 'fa-solid fa-eye';
      }
    }

    function handleLogin(e) {
      e.preventDefault();
      const pin = document.getElementById('loginPin').value.trim();
      const validPins = ['7860', '1234', 'admin123', '0000', '8888'];

      if (validPins.includes(pin)) {
        sessionStorage.setItem(ADMIN_AUTH_KEY, 'unlocked_owner');
        localStorage.setItem(ADMIN_AUTH_KEY, 'unlocked_owner');
        window.location.href = '/admin.html';
      } else {
        document.getElementById('loginAlert').classList.remove('hidden');
        document.getElementById('loginPin').value = '';
      }
    }

    // Auto redirect if already logged in
    window.addEventListener('DOMContentLoaded', () => {
      const auth = sessionStorage.getItem(ADMIN_AUTH_KEY) || localStorage.getItem(ADMIN_AUTH_KEY);
      if (auth === 'unlocked_owner') {
        window.location.href = '/admin.html';
      }
    });
  </script>
</body>
</html>
